name: Build iOS IPA

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        env:
          VITE_API_URL: "http://home.duongkum999.me:8081/api"
          VITE_IMAGE_SERVER_URL: "https://serrverimg.duongkum999.me"
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build Unsigned Archive
        working-directory: ios
        run: |
          xcodebuild -project App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA (Unsigned)
        working-directory: ios
        run: |
          cd App.xcarchive/Products/Applications
          mkdir Payload
          cp -R App.app Payload/
          zip -r ../../../App-unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: ios/App-unsigned.ipa
          retention-days: 5

      - name: Publish to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          files: ios/App-unsigned.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
